services:
  # React App Service
  react-app:
    build:
      context: ./services/react-app
      dockerfile: .Dockerfile
      args:
        - NODE_VERSION=${REACT_APP_NODE_VERSION}
        - REACT_APP_PORT=${REACT_APP_PORT}
        - REACT_APP_API_URL=${REACT_APP_API_URL}
    container_name: ${COMPOSE_PROJECT_NAME}_react-app
    ports:
      - "${REACT_APP_HOST_PORT}:${REACT_APP_PORT}"
    environment:
      - NODE_ENV=development
      - REACT_APP_API_URL=${REACT_APP_API_URL}
      - REACT_APP_STRIPE_PUBLISHABLE_KEY=${REACT_APP_STRIPE_PUBLISHABLE_KEY}
      - REACT_APP_GOOGLE_MAPS_API_KEY=${REACT_APP_GOOGLE_MAPS_API_KEY}
    volumes:
      - ./services/react-app:/app
      - /app/node_modules
    networks:
      - base2_network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:${REACT_APP_PORT}', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

  # Backend API Service
  backend:
    build:
      context: ./services/backend
      dockerfile: .Dockerfile
      args:
        - NODE_VERSION=${BACKEND_NODE_VERSION}
    container_name: ${COMPOSE_PROJECT_NAME}_backend
    ports:
      - "${BACKEND_HOST_PORT}:${BACKEND_PORT}"
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=${BACKEND_PORT}
      - DB_HOST=postgres
      - DB_PORT=${POSTGRES_PORT}
      - DB_NAME=${POSTGRES_DB}
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - RESTAURANT_LAT=40.6405
      - RESTAURANT_LNG=-74.0124
      - RESTAURANT_ADDRESS=5125 6th Ave, Brooklyn, NY 11220
      - DELIVERY_MAX_DISTANCE=10
      - DELIVERY_BASE_FEE=3.99
      - DELIVERY_PER_MILE_FEE=0.50
      - FREE_DELIVERY_MINIMUM=50.00
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRE=${JWT_EXPIRE}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      - EMAIL_FROM=${EMAIL_FROM}
      - FRONTEND_URL=${FRONTEND_URL}
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_SERVER_API_KEY}
    volumes:
      - ./services/backend:/app
    networks:
      - base2_network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:${BACKEND_PORT}/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

  # Traefik Reverse Proxy Service
  traefik:
    build:
      context: ./services/traefik
      dockerfile: .Dockerfile
      args:
        - TRAEFIK_VERSION=${TRAEFIK_VERSION}
        - TRAEFIK_LOG_LEVEL=${TRAEFIK_LOG_LEVEL}
        - TRAEFIK_PORT=${TRAEFIK_PORT}
        - TRAEFIK_API_PORT=${TRAEFIK_API_PORT}
        - TRAEFIK_API_ENTRYPOINT=${TRAEFIK_API_ENTRYPOINT}
        - TRAEFIK_DOCKER_NETWORK=${TRAEFIK_DOCKER_NETWORK}
        - TRAEFIK_EXPOSED_BY_DEFAULT=${TRAEFIK_EXPOSED_BY_DEFAULT}
    container_name: ${COMPOSE_PROJECT_NAME}_traefik
    ports:
      - "${TRAEFIK_HOST_PORT}:${TRAEFIK_PORT}"
      - "${TRAEFIK_API_PORT}:${TRAEFIK_API_PORT}"
    environment:
      - TRAEFIK_LOG_LEVEL=${TRAEFIK_LOG_LEVEL}
      - TRAEFIK_PORT=${TRAEFIK_PORT}
      - TRAEFIK_API_PORT=${TRAEFIK_API_PORT}
      - TRAEFIK_API_ENTRYPOINT=${TRAEFIK_API_ENTRYPOINT}
      - TRAEFIK_DOCKER_NETWORK=${TRAEFIK_DOCKER_NETWORK}
      - TRAEFIK_EXPOSED_BY_DEFAULT=${TRAEFIK_EXPOSED_BY_DEFAULT}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_logs:/var/log/traefik
    networks:
      - base2_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Nginx Web Server Service
  nginx:
    build:
      context: ./services/nginx
      dockerfile: .Dockerfile
      args:
        - NGINX_VERSION=${NGINX_VERSION}
        - NGINX_WORKER_PROCESSES=${NGINX_WORKER_PROCESSES}
        - NGINX_WORKER_CONNECTIONS=${NGINX_WORKER_CONNECTIONS}
        - NGINX_PORT=${NGINX_PORT}
    container_name: ${COMPOSE_PROJECT_NAME}_nginx
    ports:
      - "${NGINX_HOST_PORT}:${NGINX_PORT}"
    environment:
      - NGINX_WORKER_PROCESSES=${NGINX_WORKER_PROCESSES}
      - NGINX_WORKER_CONNECTIONS=${NGINX_WORKER_CONNECTIONS}
      - NGINX_PORT=${NGINX_PORT}
    networks:
      - base2_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:${NGINX_PORT}/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # PostgreSQL Database Service
  postgres:
    build:
      context: ./services/postgres
      dockerfile: .Dockerfile
      args:
        - POSTGRES_VERSION=${POSTGRES_VERSION}
        - POSTGRES_USER=${POSTGRES_USER}
        - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
        - POSTGRES_DB=${POSTGRES_DB}
    container_name: ${COMPOSE_PROJECT_NAME}_postgres
    ports:
      - "${POSTGRES_HOST_PORT}:${POSTGRES_PORT}"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - base2_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # pgAdmin Database Management Service
  pgadmin:
    build:
      context: ./services/pgadmin
      dockerfile: .Dockerfile
      args:
        - PGADMIN_VERSION=${PGADMIN_VERSION}
        - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
        - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
        - PGADMIN_CONFIG_SERVER_MODE=${PGADMIN_CONFIG_SERVER_MODE}
    container_name: ${COMPOSE_PROJECT_NAME}_pgadmin
    ports:
      - "${PGADMIN_HOST_PORT}:${PGADMIN_PORT}"
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
      - PGADMIN_CONFIG_SERVER_MODE=${PGADMIN_CONFIG_SERVER_MODE}
      - PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=False
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - base2_network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:${PGADMIN_PORT}/misc/ping",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

# Networks Configuration
networks:
  base2_network:
    name: ${NETWORK_NAME}
    driver: bridge

# Volumes Configuration
volumes:
  postgres_data:
    name: ${COMPOSE_PROJECT_NAME}_postgres_data
    driver: local

  pgadmin_data:
    name: ${COMPOSE_PROJECT_NAME}_pgadmin_data
    driver: local

  traefik_logs:
    name: ${COMPOSE_PROJECT_NAME}_traefik_logs
    driver: local
